<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Forms</title>
  </head>
  <body>
    <fieldset>
      <legend align="center">Basic Form</legend>

      <form>
        <div>
          <label for="fullName">Full name: </label>
          <input
            type="text"
            name="yourName"
            id="fullName"
            placeholder="Enter your name"
          />
        </div>

        <br />
        <br />

        <div>
          <label for="eMail">Email: </label>
          <input
            type="text"
            name="email"
            id="eMail"
            placeholder="Enter your email"
          />
        </div>

        <br />
        <br />
        <div>
          <label for="password">Password: </label>
          <input
            type="password"
            name="Password"
            id="password"
            placeholder="Enter your password "
          />
        </div>

        <br />
        <br />

        <div>
          <label for="confirmPassword">Confirm Password: </label>
          <input
            type="password"
            name="Password"
            id="confirmPassword"
            placeholder="Enter your confirm password "
          />
        </div>

        <br />
        <br />

        <div>
          <label for="DOB">Date of Birth: </label>
          <input type="date" name="DOB" id="DOB" />
        </div>

        <br />
        <br />
        <div>
          <label for="time">Time: </label>
          <input type="Time" name="time" id="time" />
        </div>

        <br />
        <br />

        <div>
          <label for="joiningTime">Joining time: </label>
          <input type="datetime-local" name="joiningTime" id="joiningTime" />
        </div>

        <br />
        <br />
        <div>
          <label for="volume">Volume: </label>
          <input
            type="range"
            name="volume"
            id="volume"
            min="0"
            max="10"
            value="3"
          />
        </div>

        <br />
        <br />

        <div>
          <label for="Mobile">Mobile: </label>
          <input type="number" name="Mobile" id="Mobile" />
        </div>

        <br />
        <br />
        <div>
          <label for="resume">Resume: </label>
          <input type="file" name="resume" id="resume" />
        </div>

        <br />
        <br />

        <div>
          <label for="address">Address: </label>
          <textarea name="address" id="address"></textarea>
        </div>

        <br />
        <br />

        <div>
          <label for="course">Course: </label>
          <select name="course" id="course">
            <option value="">--select course--</option>
            <option value="bTech">B tech</option>
            <option value="mTech">M tech</option>
            <option value="bba">BBA</option>
            <option value="medical">Medical</option>
          </select>
        </div>

        <br />
        <br />

        <div>
          <label for="gender">Gender:</label>
          <input type="radio" name="gender" id="male" value="Male" />
          <span>Male</span>
          <label for="gender">Gender:</label>
          <input type="radio" name="gender" id="female" value="female" />
          <span>female</span>
          <label for="gender">Gender:</label>
          <input type="radio" name="gender" id="other" value="other" />
          <span>other</span>
        </div>

        <br />
        <br />

        <div>
          <label for="skillset">Skillset:</label>
          <input type="checkbox" name="skillset" id="java" value="java" />
          <span>JAVA</span>
          <input type="checkbox" name="skillset" id="dsa" value="dsa" />
          <span>DSA</span>
          <input type="checkbox" name="html" id="other" value="html" />
          <span>HTML</span>
        </div>
        <br />
        <br />
        <div>
          <button>Submit</button>
          <button>Reset</button>
        </div>
      </form>
    </fieldset>

    <img src="" alt="" />
  </body>
</html>
