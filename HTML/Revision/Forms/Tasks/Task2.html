<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body bgcolor="skyblue">
    <h1 align="center">Forms Task 2</h1>
    <h2 align="center">
      <u>
        Create an HTML form as shown in given Image. Use only pure HTML codes.
      </u>
    </h2>
    <fieldset>
      <form>
        <h1>Pizza Order Form</h1>
        <label for="FN">First Name:</label>
        <input type="text" name="firstName" id="FN" />
        <br />
        <br />
        <label for="LN">Last Name:</label>
        <input type="text" name="lastName" id="LN" />
        <br />
        <br />
        <label for="EmailAdd">Email Address:</label>
        <input type="email" name="email" id="EmailAdd" />
        <br />
        <br />
        <label for="Mobile">Mobile Number:</label>
        <input type="tel" name="mobile" id="Mobile" />
        <br />
        <br />
        <label for="PDDate">Preferred Delivery Date:</label>
        <input type="date" name="deliveryDate" id="PDDate" />
        <br />
        <br />
        <label>Size:</label>
        <br />
        <input type="radio" name="size" id="Small" value="Small" />
        <label for="Small">Small</label>
        <input type="radio" name="size" id="Medium" value="Medium" />
        <label for="Medium">Medium</label>
        <input type="radio" name="size" id="Large" value="Large" />
        <label for="Large">Large</label>
        <br />
        <br />
        <label>Flavor:</label>
        <br />
        <br />
        <input type="checkbox" name="flavour" id="Hawaiian" value="Hawaiian" />
        <label for="Hawaiian">Hawaiian (Php 150.00)</label>
        <input type="number" name="HawaiianQuantity" min="0" max="5" />
        <br />
        <br />
        <input
          type="checkbox"
          name="flavour"
          id="Pepperoni"
          value="Pepperoni"
        />
        <label for="Pepperoni">Pepperoni (Php 140.00)</label>
        <input type="number" name="PepperoniQuantity" min="0" max="5" />
        <br />
        <br />
        <input
          type="checkbox"
          name="flavour"
          id="Vegetable"
          value="Vegetable"
        />
        <label for="Vegetable">Vegetable (Php 130.00)</label>
        <input type="number" name="VegetableQuantity" min="0" max="5" />
        <br />
        <br />
        <label for="CCno">Credit Card Number:</label>
        <input type="text" name="creditCard" id="CCno" />
        <br />
        <br />
        <label for="Pin">PIN:</label>
        <input type="password" name="pin" id="Pin" />
        <br />
        <br />
        <label for="additionalNote">Additional Note:</label>
        <br />
        <textarea
          name="additionalNote"
          id="additionalNote"
          rows="5"
          cols="30"
        ></textarea>
        <br />
        <br />
        <button type="submit">Submit Order</button>
      </form>
    </fieldset>

    <legend align="center">
      <a href="../formsIndex.html"><h3>Back to form task assignment</h3></a>
      <a href="../../index.html"><h3>Back to home</h3></a>
    </legend>
  </body>
</html>
