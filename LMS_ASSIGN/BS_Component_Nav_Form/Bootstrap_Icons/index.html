<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h2 class="text-center text-danger mb-4">
        Introduction to Bootstrap Icons
      </h2>
      <h1>..1..</h1>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded p-3">
        <a class="navbar-brand" href="#">
          <i class="bi bi-book"></i> LearnHub
        </a>

        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="#"> <i class="bi bi-house"></i> Home </a>

          <a class="nav-link" href="#">
            <i class="bi bi-journal-bookmark"></i> Courses
          </a>

          <a class="nav-link" href="#">
            <i class="bi bi-person"></i> Profile
          </a>
        </div>
      </nav>

      <div class="mt-4 p-4 border rounded">
        <h4>Download and Delete Buttons</h4>

        <button class="btn btn-primary">
          <i class="bi bi-download"></i> Download
        </button>

        <button class="btn btn-danger">
          <i class="bi bi-trash"></i> Delete
        </button>
      </div>

      <h1>..2..</h1>
      <div class="mt-4 p-4 border rounded">
        <h4>Course Status</h4>

        <div class="alert alert-success">
          <i class="bi bi-check-circle-fill"></i>
          Congratulations! Your course has been completed successfully.
        </div>

        <button class="btn btn-success">
          <i class="bi bi-search"></i> Search
        </button>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
