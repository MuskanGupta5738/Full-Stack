<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Field Validation</title>
  </head>
  <body>
    <h1>..1..</h1>
    <h2>RICR Student Age and Username Checker</h2>
    <label for="age">Student Age</label>
    <input type="number" name="age" id="age" placeholder="Enter age" />
    <button id="checkAge">Check Age</button>

    <br /><br />
    <label for="quantity">Quantity</label>
    <input
      type="number"
      name="quantity"
      id="quantity"
      min="1"
      max="10"
      required
    />
    <br /><br />

    <label for="name">User Name</label>
    <input type="text" name="name" id="name" placeholder="Enter name" />

    <h1>..2..</h1>
    <h2>RICR Student Score and Registration Code Validator</h2>
    <form id="scoreForm">
      <label>Student Marks:</label>
      <input type="number" id="marks" name="marks" min="0" max="100" required />
      <br /><br />

      <label>Attendance:</label>
      <input
        type="number"
        id="attendance"
        name="attendance"
        min="0"
        max="100"
        required
      />
      <br /><br />
      <button type="button" id="checkForm">Check Form</button>
    </form>

    <br />

    <label>Registration Code:</label>
    <input
      type="text"
      id="registrationCode"
      placeholder="Enter registration code"
    />
            
    <script src="script.js"></script>
  </body>
</html>
