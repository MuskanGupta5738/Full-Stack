<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
              <h3>Registration Form</h3>
            </div>

            <div class="card-body">
              <form>
                <div class="mb-3">
                  <label class="form-label">Full Name</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Enter your full name"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Email Address</label>
                  <input
                    type="email"
                    class="form-control"
                    placeholder="Enter your email"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Enter your password"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Message</label>
                  <textarea
                    class="form-control"
                    rows="4"
                    placeholder="Enter your message"
                  ></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label">Select Course</label>
                  <select class="form-select">
                    <option selected disabled>Choose your course</option>
                    <option>HTML</option>
                    <option>CSS</option>
                    <option>JavaScript</option>
                  </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Register
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!--  -->

    <div class="container mt-5 mb-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
              <h3>Student Registration Form</h3>
            </div>

            <div class="card-body">
              <form>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="First Name"
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Last Name"
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Select Skills</label>

                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="html" />
                    <label class="form-check-label" for="html">HTML</label>
                  </div>

                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="css" />
                    <label class="form-check-label" for="css">CSS</label>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Choose Level</label>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="level"
                      id="beginner"
                    />
                    <label class="form-check-label" for="beginner"
                      >Beginner</label
                    >
                  </div>

                  <div class="form-check">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="level"
                      id="advanced"
                    />
                    <label class="form-check-label" for="advanced"
                      >Advanced</label
                    >
                  </div>
                </div>

                <div class="form-check form-switch mb-3">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="notifications"
                  />
                  <label class="form-check-label" for="notifications">
                    Enable Notifications
                  </label>
                </div>

                <div class="mb-3">
                  <label class="form-label">Email Address</label>
                  <input
                    type="email"
                    class="form-control is-valid"
                    value="student@gmail.com"
                  />
                  <div class="valid-feedback">Looks good!</div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control is-invalid"
                    value="123"
                  />
                  <div class="invalid-feedback">
                    Please enter a valid password.
                  </div>
                </div>

                <button type="submit" class="btn btn-success w-100">
                  Submit Form
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
