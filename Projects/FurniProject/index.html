<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furni - Furniture Website</title>

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <header>
      <div class="navbar">
        <!-- Logo -->
        <h1 class="logo">Furni<span>.</span></h1>

      <!-- Navigation Links -->
      <nav>

      <div class="nav-icons">
